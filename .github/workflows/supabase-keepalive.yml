# Keeps the Supabase free-tier project from pausing (it pauses after
# 7 days without API activity and must then be restored manually).
# A REST call every 3 days counts as activity; RLS means the anon key
# sees no data, which is fine — the request itself is the point.
#
# Requires repository secrets SUPABASE_URL and SUPABASE_ANON_KEY
# (Settings → Secrets and variables → Actions).

name: Supabase keep-alive

on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL / SUPABASE_ANON_KEY secrets" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/ascents?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            --output /dev/null
          echo "Supabase pinged."
